<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belote Teranga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-height card table. Score bar on top, three seats around a centre trick, your hand at the bottom.
     Palette takes the green, gold and red of the Senegalese flag onto a card table. Single theme by choice. */
  --felt:#0f4a3c;
  --felt-deep:#08261f;
  --ivory:#f7f2e4;
  --ink:#15211d;
  --gold:#e8b93e;
  --red:#cf3a2e;
  --mute:#9fc0b4;
  --line:rgba(247,242,228,.16);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cw:clamp(40px,11.4vw,60px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--felt-deep);color:var(--ivory);font-family:var(--body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 45%,#16604e 0%,var(--felt) 45%,var(--felt-deep) 100%)}

/* top bar */
.bar{display:flex;align-items:stretch;gap:8px;padding:10px 16px 8px}
.score{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.team{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;min-width:0}
.team b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.team span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.us{border-color:rgba(232,185,62,.55)}
.tools{display:flex;gap:6px}
.tool{min-width:36px;padding:0 7px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-weight:700;font-size:13px}
.tool:hover{background:rgba(0,0,0,.45)}
.info{display:flex;justify-content:space-between;gap:10px;padding:0 16px 4px;font-size:13px;color:var(--mute);min-height:22px}
.info strong{color:var(--ivory);font-weight:700}
.suit-r{color:#ff8a7d}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border-radius:99px;padding:1px 9px}

/* table */
.table{position:relative;flex:1;min-height:300px}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;text-align:center}
.seat.n{top:6px;left:50%;transform:translateX(-50%)}
.seat.w{left:8px;top:42%;transform:translateY(-50%)}
.seat.e{right:8px;top:42%;transform:translateY(-50%)}
.name{font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.34);border:1px solid var(--line);max-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.turn .name,.me.turn .name{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.name .chip{display:inline-block;margin-left:5px;font-size:10px;font-weight:800;text-align:center;background:var(--ivory);color:var(--ink);border:1px solid var(--ink);border-radius:50%;width:15px;height:15px;line-height:15px}
.name .tk{margin-left:4px}
.backs{display:flex;justify-content:center;height:30px}
.back{width:20px;height:29px;border-radius:3px;margin-left:-13px;border:1px solid rgba(247,242,228,.75);background:repeating-linear-gradient(45deg,#a82b22 0 3px,#cf3a2e 3px 6px)}
.back:first-child{margin-left:0}
.say{font-size:12px;font-weight:700;background:var(--ivory);color:var(--ink);border-radius:9px;padding:2px 8px;min-height:0}
.say:empty{display:none}

.centre{position:absolute;left:50%;top:46%;width:calc(var(--cw)*3.5);height:calc(var(--cw)*3.5);transform:translate(-50%,-50%)}
.slot{position:absolute}
.slot.p0{left:50%;bottom:0;transform:translateX(-50%)}
.slot.p2{left:50%;top:0;transform:translateX(-50%)}
.slot.p1{right:0;top:50%;transform:translateY(-50%)}
.slot.p3{left:0;top:50%;transform:translateY(-50%)}
.slot .card.new{animation:drop .22s ease-out}
.slot .card.win{box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.4)}
@keyframes drop{from{opacity:.2;transform:scale(1.25)}to{opacity:1;transform:none}}
.turnup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}

/* cards */
.card{position:relative;display:block;width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.11);background:var(--ivory);color:var(--ink);border:1px solid #c9c1a8;box-shadow:0 3px 8px rgba(0,0,0,.35);font-family:var(--display);font-weight:800;padding:0;flex:none}
.card.r{color:var(--red)}
.card .rk{position:absolute;top:5%;left:9%;font-size:calc(var(--cw)*.36);line-height:1}
.card .sm{position:absolute;top:33%;left:9%;font-size:calc(var(--cw)*.3);line-height:1}
.card .lg{position:absolute;right:8%;bottom:4%;font-size:calc(var(--cw)*.62);line-height:1}
.card.tr::after{content:"";position:absolute;right:9%;top:7%;width:calc(var(--cw)*.14);height:calc(var(--cw)*.14);border-radius:50%;background:var(--gold);border:1px solid #9b7718}

/* my area */
.me{padding:0 16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.status{min-height:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-weight:600;text-align:center}
.btn{background:var(--gold);color:var(--ink);font-weight:700;border-radius:10px;padding:9px 16px;min-height:40px;box-shadow:0 2px 0 #9b7718}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:rgba(0,0,0,.3);color:var(--ivory);border:1px solid var(--line);box-shadow:none}
.btn.suit{font-size:22px;padding:4px 16px;background:var(--ivory)}
.btn.suit.r{color:var(--red)}
.hand{display:flex;justify-content:center;padding-top:12px;min-height:calc(var(--cw)*1.42 + 12px)}
.hand .card{margin-left:calc(var(--cw)*-.12);transition:transform .12s}
.hand .card:first-child{margin-left:0}
.hand .card.ok{transform:translateY(-10px);cursor:pointer}
.hand .card.ok:hover{transform:translateY(-16px)}
.hand .card.no{filter:brightness(.6)}
.hand .card:disabled{cursor:default}
.foot{font-size:11px;color:var(--mute);text-align:center;padding:2px 16px 8px}

/* overlays */
.veil{position:fixed;inset:0;background:rgba(4,18,14,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--ivory);color:var(--ink);border-radius:16px;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sheet h2{font-family:var(--display);font-size:24px;line-height:1.1;margin:0 0 4px;text-wrap:balance}
.sheet p{margin:0 0 12px;color:#4b5a54}
.sheet table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{padding:6px 4px;text-align:right;border-bottom:1px solid #ddd5bd}
.sheet th:first-child,.sheet td:first-child{text-align:left}
.sheet thead th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#4b5a54}
.sheet tr.tot td{font-family:var(--display);font-weight:800;font-size:19px;border-bottom:0}
.sheet .btn{width:100%}
.sheet .row{display:flex;gap:8px;margin-bottom:10px}
.sheet label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#4b5a54;margin-bottom:3px}
.sheet input[type=text]{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #b9b199;background:#fff;color:var(--ink)}
.field{flex:1;min-width:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px;border-radius:8px;border:1px solid #b9b199;font-weight:700;color:var(--ink);background:#fff}
.seg button[aria-pressed=true]{background:var(--felt);color:var(--ivory);border-color:var(--felt)}
.tag{display:inline-block;font-weight:700;font-size:12px;border-radius:99px;padding:2px 10px;background:var(--felt);color:var(--ivory);margin-bottom:8px}
.tag.bad{background:var(--red)}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:var(--ivory);color:var(--ink);font-weight:700;border-radius:12px;padding:10px 16px;z-index:3;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.merow{position:relative;width:100%;display:flex;justify-content:center;align-items:center;min-height:36px}
.chatbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--gold);color:var(--ink);font-weight:700;border-radius:99px;padding:7px 14px;box-shadow:0 2px 0 #9b7718}
.chatbtn:hover{filter:brightness(1.07)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.bub{position:absolute;max-width:200px;background:var(--ivory);color:var(--ink);font-weight:700;font-size:13px;line-height:1.25;border-radius:12px;padding:6px 10px;box-shadow:0 6px 16px rgba(0,0,0,.5);border:2px solid var(--gold);overflow-wrap:anywhere;animation:bubin .18s ease-out}
.bub small{display:block;font-size:10px;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
@keyframes bubin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.fly{position:absolute;left:0;top:0;font-size:36px;line-height:1;will-change:transform}
#chat{position:fixed;left:0;right:0;bottom:0;z-index:7;display:none;justify-content:center}
#chat.open{display:flex}
.chatbox{width:100%;max-width:560px;background:var(--ivory);color:var(--ink);border-radius:16px 16px 0 0;padding:10px 16px 14px;box-shadow:0 -10px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:9px}
.chead{display:flex;justify-content:space-between;align-items:center}
.chatbox label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#4b5a54}
.chatbox .x{font-size:22px;line-height:1;width:34px;height:34px;border-radius:50%;color:var(--ink)}
.chatbox .x:hover{background:#e4dcc4}
.seg button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatbox .seg button{padding:9px 4px;font-size:13px}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emos button{font-size:26px;line-height:1;padding:6px 0;border-radius:10px;background:#fff;border:1px solid #d6cdb2}
.emos button:hover,.lines button:hover{background:#fff6d8}
.lines{display:flex;flex-wrap:wrap;gap:6px}
.lines button{font-size:13px;font-weight:600;color:var(--ink);padding:6px 10px;border-radius:99px;background:#fff;border:1px solid #d6cdb2}
.msgrow{display:flex;gap:8px}
.msgrow input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #b9b199;background:#fff;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx" aria-hidden="true"></div>
<div id="chat"></div>
<script>
//<engine>
var Belote=(function(){
  var SUITS=['S','H','D','C'];
  var RANKS=['7','8','9','10','J','Q','K','A'];
  var T_ORDER=['7','8','Q','K','10','A','9','J'];
  var P_ORDER=['7','8','9','J','Q','K','10','A'];
  var T_PTS={J:20,'9':14,A:11,'10':10,K:4,Q:3,'8':0,'7':0};
  var P_PTS={A:11,'10':10,K:4,Q:3,J:2,'9':0,'8':0,'7':0};
  function team(p){return p%2}
  function next(p){return (p+1)%4}
  function pts(c,tr){return c.s===tr?T_PTS[c.r]:P_PTS[c.r]}
  function str(c,tr){return c.s===tr?100+T_ORDER.indexOf(c.r):P_ORDER.indexOf(c.r)}
  function deck(){var d=[];SUITS.forEach(function(s){RANKS.forEach(function(r){d.push({s:s,r:r,id:s+r})})});return d}
  function shuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  function newGame(names,target,rng){
    rng=rng||Math.random;
    var g={names:names,target:target,scores:[0,0],dealer:Math.floor(rng()*4),handNo:0,rng:rng};
    newHand(g);return g;
  }
  function newHand(g){
    var d=shuffle(deck(),g.rng),i,p;
    g.handNo++;g.hands=[[],[],[],[]];
    p=next(g.dealer);
    for(i=0;i<4;i++){g.hands[p]=d.slice(i*5,i*5+5);p=next(p)}
    g.turnUp=d[20];g.stock=d.slice(21);
    g.phase='bid1';g.turn=next(g.dealer);g.passes=0;
    g.trump=null;g.taker=null;g.trick=[];g.leader=null;g.pendingTrick=false;
    g.tricksWon=[0,0];g.pts=[0,0];g.played=[];g.says={};
    g.beloteHolder=null;g.beloteCount=0;g.result=null;g.lastWinner=null;
  }
  function bid(g,p,take,suit){
    if(g.turn!==p||(g.phase!=='bid1'&&g.phase!=='bid2'))return false;
    if(!take){
      g.says[p]='pass';g.passes++;
      if(g.passes===4){
        if(g.phase==='bid1'){g.phase='bid2';g.passes=0;g.turn=next(g.dealer)}
        else{g.dealer=next(g.dealer);newHand(g);g.redeal=true}
      }else g.turn=next(p);
      return true;
    }
    var tr=g.phase==='bid1'?g.turnUp.s:suit;
    if(g.phase==='bid2'&&(!tr||tr===g.turnUp.s||SUITS.indexOf(tr)<0))return false;
    g.trump=tr;g.taker=p;g.says={};g.says[p]='take';
    g.hands[p].push(g.turnUp);
    var q=next(g.dealer),k=0,i;
    for(i=0;i<4;i++){
      var n=q===p?2:3;
      g.hands[q]=g.hands[q].concat(g.stock.slice(k,k+n));k+=n;q=next(q);
    }
    g.stock=[];
    for(i=0;i<4;i++){
      var h=g.hands[i];
      if(h.some(function(c){return c.s===tr&&c.r==='K'})&&h.some(function(c){return c.s===tr&&c.r==='Q'}))g.beloteHolder=i;
    }
    g.phase='play';g.leader=g.turn=next(g.dealer);
    return true;
  }
  function winning(g){
    var b=g.trick[0],tr=g.trump,i;
    for(i=1;i<g.trick.length;i++){
      var x=g.trick[i];
      if(x.c.s===b.c.s){if(str(x.c,tr)>str(b.c,tr))b=x}
      else if(x.c.s===tr)b=x;
    }
    return b;
  }
  function legal(g,p){
    var h=g.hands[p],tr=g.trump;
    if(!g.trick.length)return h.slice();
    var led=g.trick[0].c.s;
    var same=h.filter(function(c){return c.s===led});
    var best=winning(g);
    var topT=best.c.s===tr?str(best.c,tr):-1;
    if(led===tr){
      if(!same.length)return h.slice();
      var hi=same.filter(function(c){return str(c,tr)>topT});
      return hi.length?hi:same;
    }
    if(same.length)return same;
    var tps=h.filter(function(c){return c.s===tr});
    if(!tps.length)return h.slice();
    if(team(best.p)===team(p))return h.slice();
    var over=tps.filter(function(c){return str(c,tr)>topT});
    return over.length?over:tps;
  }
  function play(g,p,id){
    if(g.phase!=='play'||g.turn!==p||g.pendingTrick)return false;
    var ok=legal(g,p).filter(function(c){return c.id===id})[0];
    if(!ok)return false;
    g.hands[p]=g.hands[p].filter(function(c){return c.id!==id});
    if(!g.trick.length)g.says={};
    g.trick.push({p:p,c:ok});g.played.push(ok.id);
    if(p===g.beloteHolder&&ok.s===g.trump&&(ok.r==='K'||ok.r==='Q')){
      g.beloteCount++;g.says[p]=g.beloteCount===1?'belote':'rebelote';
    }
    if(g.trick.length===4){g.pendingTrick=true;g.lastWinner=winning(g).p}
    else g.turn=next(p);
    return true;
  }
  function resolveTrick(g){
    if(!g.pendingTrick)return;
    var w=winning(g).p,t=team(w),sum=0;
    g.trick.forEach(function(x){sum+=pts(x.c,g.trump)});
    g.pts[t]+=sum;g.tricksWon[t]++;
    g.trick=[];g.pendingTrick=false;g.says={};g.leader=g.turn=w;
    if(!g.hands[0].length){g.pts[t]+=10;finishHand(g)}
  }
  function finishHand(g){
    var tk=team(g.taker),df=1-tk,bel=[0,0],hand=[0,0],made=true,capot=null;
    if(g.beloteHolder!==null)bel[team(g.beloteHolder)]=20;
    if(g.tricksWon[tk]===8){hand[tk]=250;capot=tk}
    else if(g.tricksWon[df]===8){hand[df]=250;capot=df;made=false}
    else if(g.pts[tk]+bel[tk]>g.pts[df]+bel[df]){hand[tk]=g.pts[tk];hand[df]=g.pts[df]}
    else{made=false;hand[df]=162}
    hand[0]+=bel[0];hand[1]+=bel[1];
    g.scores[0]+=hand[0];g.scores[1]+=hand[1];
    g.result={taker:g.taker,tk:tk,made:made,capot:capot,cardPts:g.pts.slice(),bel:bel,hand:hand,tricks:g.tricksWon.slice()};
    var a=g.scores[0],b=g.scores[1];
    if((a>=g.target||b>=g.target)&&a!==b){g.phase='gameEnd';g.winner=a>b?0:1}
    else g.phase='handEnd';
  }
  function nextHand(g){if(g.phase!=='handEnd')return;g.dealer=next(g.dealer);newHand(g)}

  /* computer players */
  function evalSuit(cards,s){
    var v=0,n=0,j=false,nine=false;
    var W={J:10,'9':7,A:5,'10':4,K:2,Q:2,'8':1,'7':1};
    cards.forEach(function(c){
      if(c.s===s){v+=W[c.r];n++;if(c.r==='J')j=true;if(c.r==='9')nine=true}
      else if(c.r==='A')v+=4;
      else if(c.r==='10')v+=cards.some(function(x){return x.s===c.s&&x.r==='A'})?2:0.5;
    });
    return {v:v,n:n,ok:n>=3||(j&&nine)};
  }
  function botBid(g,p){
    var cards=g.hands[p].concat([g.turnUp]);
    if(g.phase==='bid1'){var e=evalSuit(cards,g.turnUp.s);return {take:e.ok&&e.v>=14}}
    var best=null;
    SUITS.forEach(function(s){
      if(s===g.turnUp.s)return;
      var e=evalSuit(cards,s);
      if(e.ok&&e.v>=15&&(!best||e.v>best.v))best={v:e.v,s:s};
    });
    return best?{take:true,suit:best.s}:{take:false};
  }
  function botCard(g,p){
    var L=legal(g,p),tr=g.trump,h=g.hands[p];
    if(L.length===1)return L[0];
    function out(s){ /* cards of suit s still held by other players */
      return RANKS.filter(function(r){var id=s+r;return g.played.indexOf(id)<0&&!h.some(function(c){return c.id===id})})
        .map(function(r){return {s:s,r:r}});
    }
    function master(c){return out(c.s).every(function(o){return str(o,tr)<str(c,tr)})}
    function low(a){return a.slice().sort(function(x,y){
      return (x.s===tr)-(y.s===tr)||pts(x,tr)-pts(y,tr)||str(x,tr)-str(y,tr)})[0]}
    function rich(a){return a.slice().sort(function(x,y){
      return (x.s===tr)-(y.s===tr)||pts(y,tr)-pts(x,tr)})[0]}
    var outT=out(tr).length;
    if(!g.trick.length){
      var myT=L.filter(function(c){return c.s===tr});
      var plain=L.filter(function(c){return c.s!==tr});
      if(team(p)===team(g.taker)&&outT>0){
        var mt=myT.filter(master);
        if(mt.length)return mt[0];
        if(p===g.taker&&myT.length>=3)return low(myT);
      }
      var mp=plain.filter(master);
      if(mp.length&&(outT===0||mp.some(function(c){return c.r==='A'})))
        return mp.sort(function(x,y){return pts(y,tr)-pts(x,tr)})[0];
      var safe=plain.filter(function(c){return c.r!=='10'});
      return low(safe.length?safe:(plain.length?plain:L));
    }
    var best=winning(g),last=g.trick.length===3;
    var wins=L.filter(function(c){
      return (c.s===best.c.s&&str(c,tr)>str(best.c,tr))||(c.s===tr&&best.c.s!==tr)});
    if(team(best.p)===team(p)){
      var sure=last||(best.c.s===tr?master(best.c):(master(best.c)&&outT===0));
      return sure?rich(L):low(L);
    }
    if(wins.length){
      var wp=wins.filter(function(c){return c.s!==tr});
      if(wp.length)return wp.sort(function(x,y){return str(y,tr)-str(x,tr)})[0];
      return wins.sort(function(x,y){return str(x,tr)-str(y,tr)})[0];
    }
    return low(L);
  }
  return {SUITS:SUITS,team:team,next:next,pts:pts,str:str,newGame:newGame,bid:bid,legal:legal,play:play,
    winning:winning,resolveTrick:resolveTrick,nextHand:nextHand,botBid:botBid,botCard:botCard};
})();

function actx(){
  if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}

}

function tone(f,d,type,vol,when,f2){
  if(!cfg.sound)return;
  try{
    var a=actx();if(!a)return;
    var t0=a.currentTime+(when||0),o=a.createOscillator(),ga=a.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    ga.gain.setValueAtTime(.0001,t0);ga.gain.exponentialRampToValueAtTime(vol||.3,t0+.012);
    ga.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(ga);ga.connect(a.destination);o.start(t0);o.stop(t0+d+.03);
  }catch(e){}
}
function noise(d,vol,when,freq){
  if(!cfg.sound)return;
  try{
    var a=actx();if(!a)return;
    var t0=a.currentTime+(when||0),n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
    for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
    var src=a.createBufferSource(),fl=a.createBiquadFilter(),ga=a.createGain();
    src.buffer=buf;fl.type='bandpass';fl.frequency.value=freq||2000;fl.Q.value=.8;ga.gain.value=vol||.4;
    src.connect(fl);fl.connect(ga);ga.connect(a.destination);src.start(t0);
  }catch(e){}
}

    '<tr><td>'+t('cards')+'</td><td>'+r.cardPts[0]+'</td><td>'+r.cardPts[1]+'</td></tr>'+
    '<tr><td>'+t('bel')+'</td><td>'+r.bel[0]+'</td><td>'+r.bel[1]+'</td></tr>'+
    '<tr><td>'+t('thisHand')+'</td><td>'+r.hand[0]+'</td><td>'+r.hand[1]+'</td></tr>'+
    '<tr class="tot"><td>'+t('total')+'</td><td>'+g.scores[0]+'</td><td>'+g.scores[1]+'</td></tr></tbody></table>';
}
function sheetHTML(){
  var r=g.result,h='';
  if(sheet==='hand'||sheet==='game'){
    var key=r.capot!==null?'capot':(r.made?'made':'dedans');
    var v={n:esc(g.names[r.taker]),s:sym(g.trump).replace('suit-r','')};
    if(sheet==='game'){
      h+='<span class="tag'+(g.winner===0?'':' bad')+'">'+t('final')+'</span><h2>'+(g.winner===0?t('youWin'):esc(t('youLose',{a:g.names[1],b:g.names[3]})))+'</h2>';
    }else h+='<span class="tag'+(key==='dedans'?' bad':'')+'">'+t('hand',{n:g.handNo})+'</span><h2>'+t(key)+'</h2>';
    h+='<p>'+(r.capot!==null?t('capotP'):t(r.made?'madeP':'dedansP',v))+'</p>'+resultRows();
    h+=sheet==='game'?'<button class="btn" data-a="again">'+t('again')+'</button>':'<button class="btn" data-a="next">'+t('next')+'</button>';
  }else if(sheet==='settings'){
    var lab=['you','right','partner','left'];
    h+='<h2>'+t('settings')+'</h2><p>'+t('setP')+'</p>';
    [[0,2],[3,1]].forEach(function(pair){
      h+='<div class="row">';
      pair.forEach(function(i){h+='<div class="field"><label for="nm'+i+'">'+t(lab[i])+'</label><input type="text" id="nm'+i+'" maxlength="14" value="'+esc(draft.names[i])+'"></div>'});
      h+='</div>';
    });
    h+='<label>'+t('target')+'</label><div class="seg" style="margin-bottom:14px">'+[501,1000].map(function(n){
      return '<button data-a="tgt" data-n="'+n+'" aria-pressed="'+(draft.target===n)+'">'+n.toLocaleString(cfg.lang)+' '+t('pts')+'</button>'}).join('')+'</div>';
    h+='<button class="btn" data-a="start">'+t('start')+'</button><button class="btn ghost" style="color:var(--ink);margin-top:8px;border-color:#b9b199;background:none" data-a="close">'+t('cancel')+'</button>';
  }else if(sheet==='values'){
    var rows=[['J',20,2],['9',14,0],['A',11,11],['10',10,10],['K',4,4],['Q',3,3],['8',0,0],['7',0,0]];
    h+='<h2>'+t('values')+'</h2><p>'+t('valP')+'</p><table><thead><tr><th>'+t('rank')+'</th><th>'+t('inT')+'</th><th>'+t('inP')+'</th></tr></thead><tbody>'+
      rows.map(function(x){return '<tr><td>'+rk(x[0])+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>'}).join('')+'</tbody></table>'+
      '<button class="btn" data-a="close">'+t('close')+'</button>';
  }
  return h;
}
function readDraft(){
  if(sheet!=='settings')return;
  for(var i=0;i<4;i++){var el=document.getElementById('nm'+i);if(el)draft.names[i]=el.value}
}
function tick(){
  clearTimeout(T);
  if(g.phase==='handEnd'&&!sheet){sheet='hand';snd('end');handTalk()}
  if(g.phase==='gameEnd'&&!sheet){sheet='game';snd(g.winner===0?'win':'lose');handTalk()}
  render();
  if(sheet)return;
  if(g.redeal){snd('deal');T=setTimeout(function(){g.redeal=false;tick()},1700);return}
  if(g.pendingTrick){T=setTimeout(function(){var w=g.lastWinner;B.resolveTrick(g);lastPlayed=null;snd(B.team(w)===0?'trickUs':'trickThem');tick()},1400);return}
  if(g.turn===0){
    var key=g.handNo+g.phase+g.played.length+'/'+g.passes;
    if(key!==pinged){pinged=key;T=setTimeout(function(){snd('turn')},350)}
    return;
  }
  T=setTimeout(function(){
    var p=g.turn;
    if(g.phase==='play'){
      var prev=g.trick.length?B.winning(g):null,c=B.botCard(g,p);
      B.play(g,p,c.id);lastPlayed=c.id;snd(g.says[p]?'bel':'card');
      if(prev&&c.s===g.trump&&prev.c.s!==g.trump&&B.team(prev.p)!==B.team(p)&&B.pts(prev.c,g.trump)>=10&&Math.random()<.6)botSay(p,prev.p,'cut');
    }else{var b=B.botBid(g,p);B.bid(g,p,b.take,b.suit);snd(b.take?'take':'pass')}
    tick();
  },g.phase==='play'?800:950);
}
function start(){g=B.newGame(cfg.names.slice(),cfg.target);sheet=null;lastPlayed=null;closeChat();snd('deal');tick()}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==='card'){var id=b.getAttribute('data-id');if(B.play(g,0,id)){lastPlayed=id;snd(g.says[0]?'bel':'card');tick()}}
  else if(a==='take'){if(B.bid(g,0,true)){snd('take');tick()}}
  else if(a==='suit'){if(B.bid(g,0,true,b.getAttribute('data-s'))){snd('take');tick()}}
  else if(a==='pass'){if(B.bid(g,0,false)){snd('pass');tick()}}
  else if(a==='next'){sheet=null;B.nextHand(g);snd('deal');tick()}
  else if(a==='again'){start()}
  else if(a==='lang'){readDraft();cfg.lang=cfg.lang==='fr'?'en':'fr';save();render();if(chatEl.classList.contains('open'))renderChat()}
  else if(a==='chat'){if(chatEl.classList.contains('open'))closeChat();else{chatEl.classList.add('open');renderChat()}}
  else if(a==='sound'){cfg.sound=!cfg.sound;save();render();snd('take')}
  else if(a==='values'){if(!sheet){clearTimeout(T);sheet='values';render()}}
  else if(a==='settings'){if(!sheet||sheet==='values'){clearTimeout(T);draft={names:g.names.slice(),target:g.target};sheet='settings';render()}}
  else if(a==='tgt'){readDraft();draft.target=+b.getAttribute('data-n');render()}
  else if(a==='close'){sheet=null;tick()}
  else if(a==='start'){
    readDraft();
    var def=['AB','Katim','Yama','Cous Cous'];
    cfg.names=draft.names.map(function(n,i){n=n.trim();return n||def[i]});cfg.target=draft.target;save();start();
  }
});
start();
})();
</script>
