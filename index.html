<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belote Teranga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-height card table. Score bar on top, three seats around a centre trick, your hand at the bottom.
     Palette takes the green, gold and red of the Senegalese flag onto a card table. Single theme by choice. */
  --felt:#0f4a3c;
  --felt-deep:#08261f;
  --ivory:#f7f2e4;
  --ink:#15211d;
  --gold:#e8b93e;
  --red:#cf3a2e;
  --mute:#9fc0b4;
  --line:rgba(247,242,228,.16);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cw:clamp(40px,11.4vw,60px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--felt-deep);color:var(--ivory);font-family:var(--body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 45%,#16604e 0%,var(--felt) 45%,var(--felt-deep) 100%)}

/* top bar */
.bar{display:flex;align-items:stretch;gap:8px;padding:10px 16px 8px}
.score{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.team{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;min-width:0}
.team b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.team span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.us{border-color:rgba(232,185,62,.55)}
.tools{display:flex;gap:6px}
.tool{min-width:36px;padding:0 7px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-weight:700;font-size:13px}
.tool:hover{background:rgba(0,0,0,.45)}
.info{display:flex;justify-content:space-between;gap:10px;padding:0 16px 4px;font-size:13px;color:var(--mute);min-height:22px}
.info strong{color:var(--ivory);font-weight:700}
.suit-r{color:#ff8a7d}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border-radius:99px;padding:1px 9px}

/* table */
.table{position:relative;flex:1;min-height:300px}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;text-align:center}
.seat.n{top:6px;left:50%;transform:translateX(-50%)}
.seat.w{left:8px;top:42%;transform:translateY(-50%)}
.seat.e{right:8px;top:42%;transform:translateY(-50%)}
.name{font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.34);border:1px solid var(--line);max-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.turn .name,.me.turn .name{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.name .chip{display:inline-block;margin-left:5px;font-size:10px;font-weight:800;text-align:center;background:var(--ivory);color:var(--ink);border:1px solid var(--ink);border-radius:50%;width:15px;height:15px;line-height:15px}
.name .tk{margin-left:4px}
.backs{display:flex;justify-content:center;height:30px}
.back{width:20px;height:29px;border-radius:3px;margin-left:-13px;border:1px solid rgba(247,242,228,.75);background:repeating-linear-gradient(45deg,#a82b22 0 3px,#cf3a2e 3px 6px)}
.back:first-child{margin-left:0}
.say{font-size:12px;font-weight:700;background:var(--ivory);color:var(--ink);border-radius:9px;padding:2px 8px;min-height:0}
.say:empty{display:none}

.centre{position:absolute;left:50%;top:46%;width:calc(var(--cw)*3.5);height:calc(var(--cw)*3.5);transform:translate(-50%,-50%)}
.slot{position:absolute}
.slot.p0{left:50%;bottom:0;transform:translateX(-50%)}
.slot.p2{left:50%;top:0;transform:translateX(-50%)}
.slot.p1{right:0;top:50%;transform:translateY(-50%)}
.slot.p3{left:0;top:50%;transform:translateY(-50%)}
.slot .card.new{animation:drop .22s ease-out}
.slot .card.win{box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.4)}
@keyframes drop{from{opacity:.2;transform:scale(1.25)}to{opacity:1;transform:none}}
.turnup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}

/* cards */
.card{position:relative;display:block;width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.11);background:var(--ivory);color:var(--ink);border:1px solid #c9c1a8;box-shadow:0 3px 8px rgba(0,0,0,.35);font-family:var(--display);font-weight:800;padding:0;flex:none}
.card.r{color:var(--red)}
.card .rk{position:absolute;top:5%;left:9%;font-size:calc(var(--cw)*.36);line-height:1}
.card .sm{position:absolute;top:33%;left:9%;font-size:calc(var(--cw)*.3);line-height:1}
.card .lg{position:absolute;right:8%;bottom:4%;font-size:calc(var(--cw)*.62);line-height:1}
.card.tr::after{content:"";position:absolute;right:9%;top:7%;width:calc(var(--cw)*.14);height:calc(var(--cw)*.14);border-radius:50%;background:var(--gold);border:1px solid #9b7718}

/* my area */
.me{padding:0 16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.status{min-height:40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-weight:600;text-align:center}
.btn{background:var(--gold);color:var(--ink);font-weight:700;border-radius:10px;padding:9px 16px;min-height:40px;box-shadow:0 2px 0 #9b7718}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:rgba(0,0,0,.3);color:var(--ivory);border:1px solid var(--line);box-shadow:none}
.btn.suit{font-size:22px;padding:4px 16px;background:var(--ivory)}
.btn.suit.r{color:var(--red)}
.hand{display:flex;justify-content:center;padding-top:12px;min-height:calc(var(--cw)*1.42 + 12px)}
.hand .card{margin-left:calc(var(--cw)*-.12);transition:transform .12s}
.hand .card:first-child{margin-left:0}
.hand .card.ok{transform:translateY(-10px);cursor:pointer}
.hand .card.ok:hover{transform:translateY(-16px)}
.hand .card.no{filter:brightness(.6)}
.hand .card:disabled{cursor:default}
.foot{font-size:11px;color:var(--mute);text-align:center;padding:2px 16px 8px}

/* overlays */
.veil{position:fixed;inset:0;background:rgba(4,18,14,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--ivory);color:var(--ink);border-radius:16px;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.sheet h2{font-family:var(--display);font-size:24px;line-height:1.1;margin:0 0 4px;text-wrap:balance}
.sheet p{margin:0 0 12px;color:#4b5a54}
.sheet table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{padding:6px 4px;text-align:right;border-bottom:1px solid #ddd5bd}
.sheet th:first-child,.sheet td:first-child{text-align:left}
.sheet thead th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#4b5a54}
.sheet tr.tot td{font-family:var(--display);font-weight:800;font-size:19px;border-bottom:0}
.sheet .btn{width:100%}
.sheet .row{display:flex;gap:8px;margin-bottom:10px}
.sheet label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#4b5a54;margin-bottom:3px}
.sheet input[type=text]{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #b9b199;background:#fff;color:var(--ink)}
.field{flex:1;min-width:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px;border-radius:8px;border:1px solid #b9b199;font-weight:700;color:var(--ink);background:#fff}
.seg button[aria-pressed=true]{background:var(--felt);color:var(--ivory);border-color:var(--felt)}
.tag{display:inline-block;font-weight:700;font-size:12px;border-radius:99px;padding:2px 10px;background:var(--felt);color:var(--ivory);margin-bottom:8px}
.tag.bad{background:var(--red)}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:var(--ivory);color:var(--ink);font-weight:700;border-radius:12px;padding:10px 16px;z-index:3;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pile{position:absolute;left:14px;top:46%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.pile .card.off{opacity:.45}
.stockback{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.11);border:2px solid rgba(247,242,228,.85);background:repeating-linear-gradient(45deg,#a82b22 0 4px,#cf3a2e 4px 8px);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--ivory);text-shadow:0 1px 3px #000;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.mpts{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.3);border-radius:99px;padding:1px 9px}
.merow .mpts{position:absolute;left:0;top:50%;transform:translateY(-50%)}
.hand .card.mar{box-shadow:0 0 0 3px var(--gold),0 3px 8px rgba(0,0,0,.35)}
.gamepick button{white-space:normal;line-height:1.2;padding:10px 6px}
.gamepick small{display:block;font-weight:600;font-size:11px;opacity:.8}
.merow{position:relative;width:100%;display:flex;justify-content:center;align-items:center;min-height:36px}
.chatbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--gold);color:var(--ink);font-weight:700;border-radius:99px;padding:7px 14px;box-shadow:0 2px 0 #9b7718}
.chatbtn:hover{filter:brightness(1.07)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.bub{position:absolute;max-width:200px;background:var(--ivory);color:var(--ink);font-weight:700;font-size:13px;line-height:1.25;border-radius:12px;padding:6px 10px;box-shadow:0 6px 16px rgba(0,0,0,.5);border:2px solid var(--gold);overflow-wrap:anywhere;animation:bubin .18s ease-out}
.bub small{display:block;font-size:10px;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
@keyframes bubin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.fly{position:absolute;left:0;top:0;font-size:36px;line-height:1;will-change:transform}
#chat{position:fixed;left:0;right:0;bottom:0;z-index:7;display:none;justify-content:center}
#chat.open{display:flex}
.chatbox{width:100%;max-width:560px;background:var(--ivory);color:var(--ink);border-radius:16px 16px 0 0;padding:10px 16px 14px;box-shadow:0 -10px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:9px}
.chead{display:flex;justify-content:space-between;align-items:center}
.chatbox label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#4b5a54}
.chatbox .x{font-size:22px;line-height:1;width:34px;height:34px;border-radius:50%;color:var(--ink)}
.chatbox .x:hover{background:#e4dcc4}
.seg button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatbox .seg button{padding:9px 4px;font-size:13px}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emos button{font-size:26px;line-height:1;padding:6px 0;border-radius:10px;background:#fff;border:1px solid #d6cdb2}
.emos button:hover,.lines button:hover{background:#fff6d8}
.lines{display:flex;flex-wrap:wrap;gap:6px}
.lines button{font-size:13px;font-weight:600;color:var(--ink);padding:6px 10px;border-radius:99px;background:#fff;border:1px solid #d6cdb2}
.msgrow{display:flex;gap:8px}
.msgrow input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #b9b199;background:#fff;color:var(--ink)}
.code{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.14em;line-height:1.1;margin:2px 0 6px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.lgrid>div{display:flex;flex-direction:column;gap:6px}
.lseat{display:block;width:100%;padding:10px 8px;border-radius:10px;border:2px dashed #b9b199;background:#fff;color:var(--ink);font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lseat.on{border-style:solid;border-color:var(--felt);background:#e9f1ec}
.lseat:disabled{cursor:default}
.lseat:not(:disabled):hover{background:#fff6d8}
.lseat small{font-weight:600;color:#4b5a54}
.err{color:var(--red)!important;font-weight:700}
.onl{margin-top:14px;padding-top:12px;border-top:1px solid #ddd5bd}
.btn.alt{background:var(--felt);color:var(--ivory);box-shadow:0 2px 0 var(--felt-deep)}
.btn.ghost.dk{color:var(--ink);border-color:#b9b199;background:none}
.sheet .row input{flex:1;min-width:0}
#jc{text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.sp{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px 4px;flex-wrap:wrap}
.spl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.spr{display:flex;align-items:center;gap:6px}
.spc{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 8px;border-radius:8px;background:#fff;border:1px solid rgba(0,0,0,.12)}
.spc img{display:block;height:22px;width:auto;max-width:none}
.spc.s2 img{height:17px}
.spc b{font-family:var(--display);font-weight:800;font-size:12px;color:#2c4a2e;white-space:nowrap}
.sheet .sp{padding:12px 0 0;margin-top:12px;border-top:1px solid #ddd5bd}
.sheet .spl{color:#4b5a54}
.sheet .sp.top{padding:0 0 12px;margin:0 0 12px;border-top:0;border-bottom:1px solid #ddd5bd}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="fx" aria-hidden="true"></div>
<div id="chat"></div>
<script>
//<engine>
var Belote=(function(){
  var SUITS=['S','H','D','C'];
  var RANKS=['7','8','9','10','J','Q','K','A'];
  var T_ORDER=['7','8','Q','K','10','A','9','J'];
  var P_ORDER=['7','8','9','J','Q','K','10','A'];
  var T_PTS={J:20,'9':14,A:11,'10':10,K:4,Q:3,'8':0,'7':0};
  var P_PTS={A:11,'10':10,K:4,Q:3,J:2,'9':0,'8':0,'7':0};
  function team(p){return p%2}
  function next(p){return (p+1)%4}
  function pts(c,tr){return c.s===tr?T_PTS[c.r]:P_PTS[c.r]}
  function str(c,tr){return c.s===tr?100+T_ORDER.indexOf(c.r):P_ORDER.indexOf(c.r)}
  function deck(){var d=[];SUITS.forEach(function(s){RANKS.forEach(function(r){d.push({s:s,r:r,id:s+r})})});return d}
  function shuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  function newGame(names,target,rng){
    rng=rng||Math.random;
    var g={names:names,target:target,scores:[0,0],dealer:Math.floor(rng()*4),handNo:0,rng:rng};
    newHand(g);return g;
  }
  function newHand(g){
    var d=shuffle(deck(),g.rng),i,p;
    g.handNo++;g.hands=[[],[],[],[]];
    p=next(g.dealer);
    for(i=0;i<4;i++){g.hands[p]=d.slice(i*5,i*5+5);p=next(p)}
    g.turnUp=d[20];g.stock=d.slice(21);
    g.phase='bid1';g.turn=next(g.dealer);g.passes=0;
    g.trump=null;g.taker=null;g.trick=[];g.leader=null;g.pendingTrick=false;
    g.tricksWon=[0,0];g.pts=[0,0];g.played=[];g.says={};
    g.beloteHolder=null;g.beloteCount=0;g.result=null;g.lastWinner=null;
  }
  function bid(g,p,take,suit){
    if(g.turn!==p||(g.phase!=='bid1'&&g.phase!=='bid2'))return false;
    if(!take){
      g.says[p]='pass';g.passes++;
      if(g.passes===4){
        if(g.phase==='bid1'){g.phase='bid2';g.passes=0;g.turn=next(g.dealer)}
        else{g.dealer=next(g.dealer);newHand(g);g.redeal=true}
      }else g.turn=next(p);
      return true;
    }
    var tr=g.phase==='bid1'?g.turnUp.s:suit;
    if(g.phase==='bid2'&&(!tr||tr===g.turnUp.s||SUITS.indexOf(tr)<0))return false;
    g.trump=tr;g.taker=p;g.says={};g.says[p]='take';
    g.hands[p].push(g.turnUp);
    var q=next(g.dealer),k=0,i;
    for(i=0;i<4;i++){
      var n=q===p?2:3;
      g.hands[q]=g.hands[q].concat(g.stock.slice(k,k+n));k+=n;q=next(q);
    }
    g.stock=[];
    for(i=0;i<4;i++){
      var h=g.hands[i];
      if(h.some(function(c){return c.s===tr&&c.r==='K'})&&h.some(function(c){return c.s===tr&&c.r==='Q'}))g.beloteHolder=i;
    }
    g.phase='play';g.leader=g.turn=next(g.dealer);
    return true;
  }
  function winning(g){
    var b=g.trick[0],tr=g.trump,i;
    for(i=1;i<g.trick.length;i++){
      var x=g.trick[i];
      if(x.c.s===b.c.s){if(str(x.c,tr)>str(b.c,tr))b=x}
      else if(x.c.s===tr)b=x;
    }
    return b;
  }
  function legal(g,p){
    var h=g.hands[p],tr=g.trump;
    if(!g.trick.length)return h.slice();
    var led=g.trick[0].c.s;
    var same=h.filter(function(c){return c.s===led});
    var best=winning(g);
    var topT=best.c.s===tr?str(best.c,tr):-1;
    if(led===tr){
      if(!same.length)return h.slice();
      var hi=same.filter(function(c){return str(c,tr)>topT});
      return hi.length?hi:same;
    }
    if(same.length)return same;
    var tps=h.filter(function(c){return c.s===tr});
    if(!tps.length)return h.slice();
    if(team(best.p)===team(p))return h.slice();
    var over=tps.filter(function(c){return str(c,tr)>topT});
    return over.length?over:tps;
  }
  function play(g,p,id){
    if(g.phase!=='play'||g.turn!==p||g.pendingTrick)return false;
    var ok=legal(g,p).filter(function(c){return c.id===id})[0];
    if(!ok)return false;
    g.hands[p]=g.hands[p].filter(function(c){return c.id!==id});
    if(!g.trick.length)g.says={};
    g.trick.push({p:p,c:ok});g.played.push(ok.id);
    if(p===g.beloteHolder&&ok.s===g.trump&&(ok.r==='K'||ok.r==='Q')){
      g.beloteCount++;g.says[p]=g.beloteCount===1?'belote':'rebelote';
    }
    if(g.trick.length===4){g.pendingTrick=true;g.lastWinner=winning(g).p}
    else g.turn=next(p);
    return true;
  }
  function resolveTrick(g){
    if(!g.pendingTrick)return;
    var w=winning(g).p,t=team(w),sum=0;
    g.trick.forEach(function(x){sum+=pts(x.c,g.trump)});
    g.pts[t]+=sum;g.tricksWon[t]++;
    g.trick=[];g.pendingTrick=false;g.says={};g.leader=g.turn=w;
    if(!g.hands[0].length){g.pts[t]+=10;finishHand(g)}
  }
  function finishHand(g){
    var tk=team(g.taker),df=1-tk,bel=[0,0],hand=[0,0],made=true,capot=null;
    if(g.beloteHolder!==null)bel[team(g.beloteHolder)]=20;
    if(g.tricksWon[tk]===8){hand[tk]=250;capot=tk}
    else if(g.tricksWon[df]===8){hand[df]=250;capot=df;made=false}
    else if(g.pts[tk]+bel[tk]>g.pts[df]+bel[df]){hand[tk]=g.pts[tk];hand[df]=g.pts[df]}
    else{made=false;hand[df]=162}
    hand[0]+=bel[0];hand[1]+=bel[1];
    g.scores[0]+=hand[0];g.scores[1]+=hand[1];

var Mariage=(function(){

    m.says={};m.result=null;m.lastWinner=null;m.lastBonus=null;
  }
  function pile(m){return m.closed?0:m.stock.length+(m.turnUp?1:0)}

  function leading(m,p){return m.phase==='play'&&m.turn===p&&!m.trick.length&&!m.pending}
  function canSwap(m,p){return leading(m,p)&&!m.closed&&!!m.turnUp&&m.stock.length>0&&m.turnUp.r!=='7'&&has(m,p,m.trump,'7')}
  function swap(m,p){

        var mar=h.filter(function(c){return c.r==='Q'&&pair(c)}).sort(function(x,y){return (y.s===tr)-(x.s===tr)});
        if(mar.length)return {card:mar[0]};

    if(strict(m))return {card:wins.length?wins[0]:low(L)};
    var same=wins.filter(function(c){return c.s===lead.s});
    if(same.length){var top=same[same.length-1];if(pts(top)>=10||pts(lead)>=4)return {card:top}}

      var tw=wins.filter(function(c){return c.s===tr&&!pair(c)});

      if(wins.length)return {card:wins[0]};
    }
    var dump=L.filter(function(c){return c.s!==tr&&!pair(c)&&pts(c)<10});
    return {card:low(dump.length?dump:L)};
  }

function tone(f,d,type,vol,when,f2){
  if(!cfg.sound)return;
  try{
    var a=actx();if(!a)return;
    var t0=a.currentTime+(when||0),o=a.createOscillator(),ga=a.createGain();

  }catch(e){}
}

    var t0=a.currentTime+(when||0),n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);

}

/* chat: trash talk and emojis. Seats here are real player numbers; viewOf() places them on this screen. */
function seatBox(p){
  var el=document.getElementById('seat'+viewOf(p));
  if(!el)return {x:innerWidth/2,y:innerHeight/2,top:innerHeight/2,bottom:innerHeight/2};
  var r=el.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2,top:r.top,bottom:r.bottom};
}
function bubble(p,html){
  var old=fx.querySelector('.bub[data-p="'+p+'"]');if(old)old.remove();
  var b=document.createElement('div');b.className='bub';b.setAttribute('data-p',p);b.innerHTML=html;fx.appendChild(b);
  var s=seatBox(p),w=b.offsetWidth,h=b.offsetHeight,ar=app.getBoundingClientRect();
  b.style.left=Math.max(ar.left+8,Math.min(ar.right-8-w,s.x-w/2))+'px';
  b.style.top=(viewOf(p)===0?s.top-h-10:s.bottom+36)+'px';
  setTimeout(function(){b.remove()},3600);
}
function fly(from,to,em){
  var a=seatBox(from),b=seatBox(to),e=document.createElement('div');
  e.className='fly';e.textContent=em;fx.appendChild(e);
  function tf(x,y,sc,rot){return 'translate('+(x-18)+'px,'+(y-18)+'px) scale('+sc+') rotate('+rot+'deg)'}
  var still=!e.animate||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
  if(still){e.style.transform=tf(b.x,b.y,1.8,0);snd('pop');setTimeout(function(){e.remove()},1600);return}
  var mx=(a.x+b.x)/2,my=Math.min(a.y,b.y)-70;
  var an=e.animate([
    {transform:tf(a.x,a.y,.6,0),opacity:1},
    {transform:tf(mx,my,1.5,200),opacity:1,offset:.42},
    {transform:tf(b.x,b.y,1,360),opacity:1,offset:.7},
    {transform:tf(b.x,b.y,2.6,360),opacity:1,offset:.78},
    {transform:tf(b.x,b.y,1.9,360),opacity:1,offset:.94},
    {transform:tf(b.x,b.y,1.9,360),opacity:0}],{duration:2100,easing:'ease-in-out',fill:'forwards'});
  setTimeout(function(){snd('pop')},1500);
  an.onfinish=function(){e.remove()};
}
function showMsg(from,to,m){ /* to: player number, or null for everyone. m: {e:emoji} or {t:text} */
  if(m.e){
    snd('whoosh');
    (to===null?players().filter(function(q){return q!==from}):[to]).forEach(function(q){fly(from,q,m.e)});
  }else{
    bubble(from,(to!==null?'<small>'+esc(t('toX',{n:g.names[to]}))+'</small>':'')+esc(m.t));snd('msg');
  }
}
function send(to,m){
  if(on()){
    var d={f:me,t:to===null?-1:to,ts:{'.sv':'timestamp'}};
    if(m.e)d.e=m.e;else d.m=m.t;
    api('POST',net.code,'/chat',d).catch(netFail);
  }else{showMsg(me,to,m);botAnswer(to,m)}
}
function botAnswer(to,m){
  var who=to===null?pick(players().filter(function(q){return q!==me})):to,mate=!isM()&&who===2;
  if(Math.random()>.7)return;
  setTimeout(function(){
    if(on())return;
    var L=TX[cfg.lang];
    if(m.e)showMsg(who,me,{e:mate?pick(['👏','😂','💪']):pick(['😎','🤫','😂','🥱'])});
    else showMsg(who,me,{t:mate?pick(L.bPraise):pick(L.bBack)});
  },m.e?2400:1500);
}
function botSay(from,to,kind){
  if(on()||from===me||from===to||Date.now()-lastBot<6000)return;
  lastBot=Date.now();
  var L=TX[cfg.lang];
  setTimeout(function(){
    if(on())return;
    if(kind==='cut')showMsg(from,to,Math.random()<.5?{e:pick(['😎','😂','🤫'])}:{t:pick(L.bCut)});
    else if(kind==='dedans')showMsg(from,to,Math.random()<.5?{e:'😂'}:{t:pick(L.bDedans)});
    else if(kind==='praise')showMsg(from,to,Math.random()<.5?{e:'👏'}:{t:pick(L.bPraise)});
    else if(kind==='boast')showMsg(from,to,Math.random()<.5?{e:'😎'}:{t:pick(L.bBoast)});
    else if(kind==='crown')showMsg(from,to,{e:'👑'});
  },700);
}
function endTalk(){
  var r=g.result;if(!r||on())return;
  if(isM()){
    if(g.phase==='matchEnd'){lastBot=0;if(r.winner!==me)botSay(1-me,me,'crown');return}
    if(r.winner!==me&&Math.random()<.7)botSay(1-me,me,'boast');
    return;
  }
  if(g.phase==='gameEnd'){lastBot=0;botSay(g.winner===0?2:pick([1,3]),null,'crown');return}
  if(Math.random()>.75)return;
  if(!r.made){var d=[1,2,3].filter(function(p){return B.team(p)!==r.tk});botSay(pick(d),r.taker,'dedans')}
  else if(r.tk===0)botSay(2,0,'praise');
  else botSay(r.taker,null,'boast');
}
function renderChat(){

  h+='<form class="msgrow" id="msgf"><input type="text" id="msg" maxlength="40" placeholder="'+t('write')+'" autocomplete="off" aria-label="'+t('write')+'"><button class="btn" type="submit">'+t('send')+'</button></form></div>';

function closeChat(){chatEl.classList.remove('open');chatEl.innerHTML=''}
chatEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-c]');if(!b)return;

function cardHTML(c,cls,tag,attr){

  var inner='<span class="rk">'+rk(c.r)+'</span><span class="sm">'+SYM[c.s]+'</span><span class="lg">'+SYM[c.s]+'</span>';

function sortHand(h){
  var base=['S','H','C','D'],i=g.trump?base.indexOf(g.trump):0,ord=base.slice(i).concat(base.slice(0,i));
  var st=isM()?function(c){return M.rank(c)}:function(c){return B.str(c,g.trump)};
  return h.slice().sort(function(a,b){return ord.indexOf(a.s)-ord.indexOf(b.s)||st(b)-st(a)});

      '<tr><td>'+t('mTot')+'</td><td>'+r.totals[me]+'</td><td>'+r.totals[op]+'</td></tr>'+
      '<tr class="tot"><td>'+t('gpts')+'</td><td>'+g.gp[me]+'</td><td>'+g.gp[op]+'</td></tr></tbody></table>';
    h+=sheet==='mmatch'?endBtn():'<button class="btn" data-a="next">'+t('nextD')+'</button>';
  }else if(sheet==='hand'||sheet==='game'){
    var us=B.team(me),th=1-us,key=r.capot!==null?'capot':(r.made?'made':'dedans');
    var v={n:esc(g.names[r.taker]),s:sym(g.trump).replace('suit-r','')};
    if(sheet==='game'){
      var a=(me+1)%4,b2=(me+3)%4;
      h+='<span class="tag'+(g.winner===us?'':' bad')+'">'+t('final')+'</span><h2>'+(g.winner===us?t('youWin'):esc(t('youLose',{a:g.names[a],b:g.names[b2]})))+'</h2>';
    }else h+='<span class="tag'+(key==='dedans'?' bad':'')+'">'+t('hand',{n:g.handNo})+'</span><h2>'+t(key)+'</h2>';
    h+='<p>'+(r.capot!==null?t('capotP'):t(r.made?'madeP':'dedansP',v))+'</p>';
    h+='<table><thead><tr><th></th><th>'+t('us')+'</th><th>'+t('them')+'</th></tr></thead><tbody>'+
      '<tr><td>'+t('tricks')+'</td><td>'+r.tricks[us]+'</td><td>'+r.tricks[th]+'</td></tr>'+
      '<tr><td>'+t('cards')+'</td><td>'+r.cardPts[us]+'</td><td>'+r.cardPts[th]+'</td></tr>'+
      '<tr><td>'+t('bel')+'</td><td>'+r.bel[us]+'</td><td>'+r.bel[th]+'</td></tr>'+
      '<tr><td>'+t('thisHand')+'</td><td>'+r.hand[us]+'</td><td>'+r.hand[th]+'</td></tr>'+
      '<tr class="tot"><td>'+t('total')+'</td><td>'+g.scores[us]+'</td><td>'+g.scores[th]+'</td></tr></tbody></table>';
    h+=sheet==='game'?endBtn():'<button class="btn" data-a="next">'+t('next')+'</button>';
  }else if(sheet==='settings'){
    var lab=draft.game==='mariage'?['you','opp']:['you','right','partner','left'];
    h+='<h2>'+t('choose')+'</h2><div class="seg gamepick" style="margin:10px 0 8px">'+['belote','mariage'].map(function(k){
      return '<button data-a="game" data-g="'+k+'" aria-pressed="'+(draft.game===k)+'">'+t(k==='belote'?'gB':'gM')+'<small>'+t(k==='belote'?'gBs':'gMs')+'</small></button>'}).join('')+'</div>';
    h+='<p>'+t(draft.game==='mariage'?'descM':'descB')+'</p>';
    (draft.game==='mariage'?[[0,1]]:[[0,2],[3,1]]).forEach(function(pair){
      h+='<div class="row">';
      pair.forEach(function(i){h+='<div class="field"><label for="nm'+i+'">'+t(lab[i])+'</label><input type="text" id="nm'+i+'" maxlength="14" value="'+esc(draft.names[i])+'"></div>'});
      h+='</div>';
    });
    if(draft.game!=='mariage')h+='<label>'+t('target')+'</label><div class="seg" style="margin-bottom:14px">'+[501,1000].map(function(n){
      return '<button data-a="tgt" data-n="'+n+'" aria-pressed="'+(draft.target===n)+'">'+n.toLocaleString(cfg.lang)+' '+t('pts')+'</button>'}).join('')+'</div>';
    h+='<button class="btn" data-a="start">'+t('vsCpu')+'</button>';
    h+='<div class="onl"><label>'+t('onlineH')+'</label><button class="btn alt" data-a="create">'+t('create')+'</button>';
    h+='<label for="jc" style="margin-top:10px">'+t('orJoin')+'</label><div class="row" style="margin-bottom:0"><input type="text" id="jc" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="'+t('codePh')+'" value="'+esc(draft.code||'')+'"><button class="btn alt" style="width:auto" data-a="join">'+t('join')+'</button></div>';
    if(netMsg)h+='<p class="err">'+esc(netMsg)+'</p>';
    h+='</div><button class="btn ghost dk" style="margin-top:10px" data-a="close">'+t('cancel')+'</button>';
  }else if(sheet==='values'){
    var rows=isM()?[['A',11,11],['10',10,10],['K',4,4],['Q',3,3],['J',2,2],['9',0,0],['8',0,0],['7',0,0]]:[['J',20,2],['9',14,0],['A',11,11],['10',10,10],['K',4,4],['Q',3,3],['8',0,0],['7',0,0]];
    h+='<h2>'+t('values')+'</h2><p>'+t(isM()?'valPM':'valP')+'</p><table><thead><tr><th>'+t('rank')+'</th><th>'+t('inT')+'</th><th>'+t('inP')+'</th></tr></thead><tbody>'+
      rows.map(function(x){return '<tr><td>'+rk(x[0])+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>'}).join('')+'</tbody></table>'+
      '<button class="btn" data-a="close">'+t('close')+'</button>';
  }
  if(sheet==='settings'||sheet==='lobby')h=sponsors().replace('class="sp"','class="sp top"')+h;
  else if(sheet!=='values')h+=sponsors();
  return h;
}
function endBtn(){return on()?'<button class="btn" data-a="leave">'+t('leave')+'</button>':'<button class="btn" data-a="again">'+t('again')+'</button>'}
function readDraft(){
  if(sheet!=='settings')return;
  for(var i=0;i<4;i++){var el=document.getElementById('nm'+i);if(el)draft.names[i]=el.value}
  var jc=document.getElementById('jc');if(jc)draft.code=jc.value;
}

/* game loop: one pending duty at a time. Offline this device plays the computer seats;
   online the host does, and every device keeps a slower fallback so a game never stalls. */
function ser(x){return JSON.stringify(x,function(k,v){return k==='rng'?undefined:v})}
function commit(){
  turnAt=Date.now();
  if(on()){g.v=(g.v||0)+1;var j=ser(g);net.lastJ=j;api('PUT',net.code,'/state',{v:g.v,j:j}).catch(netFail)}
  tick();
}
function endKind(){return {handEnd:'hand',gameEnd:'game',dealEnd:'mdeal',matchEnd:'mmatch'}[g.phase]||null}
function isEndSheet(s){return s==='hand'||s==='game'||s==='mdeal'||s==='mmatch'}
function tick(){
  clearTimeout(T);
  if(g.redeal){g.redeal=false;toastUntil=Date.now()+1700;snd('deal');setTimeout(render,1750)}
  var over=endKind();
  if(over&&sheet!==over&&(!sheet||isEndSheet(sheet))){
    sheet=over;
    var won=isM()?g.gp[me]>g.gp[1-me]:g.winner===B.team(me);
    snd(over==='game'||over==='mmatch'?(won?'win':'lose'):'end');endTalk();
  }
  if(!over&&isEndSheet(sheet))sheet=null;
  render();
  if(!on()&&sheet)return;
  var d=duty();
  if(d){
    var v=g.v,wait=Math.max(0,toastUntil-Date.now());
    T=setTimeout(function(){if(on()&&g.v!==v)return;d.run()},d.ms+wait);
  }
}
function ping(){
  var key=(isM()?'m'+g.dealNo:g.handNo+g.phase+'/'+g.passes)+'/'+g.played.length+(on()?net.code:'');
  if(key!==pinged){pinged=key;setTimeout(function(){snd('turn')},350)}
}
function duty(){
  var mar=isM(),o=on(),host=o&&net.host,ms;
  if(g.phase==='gameEnd'||g.phase==='matchEnd')return null;
  if(g.phase==='handEnd'||g.phase==='dealEnd'){
    if(!o)return null;
    return {ms:(host?15000:35000+me*2000)*TS,run:nextRound};
  }
  if(mar?g.pending:g.pendingTrick){
    var a=g.trick[g.trick.length-1].p;
    ms=!o?1400:(a===me||(isBot(a)&&host))?1400:host?1400+2100*TS:1400+(5600+me*900)*TS;
    return {ms:ms,run:function(){var w=g.lastWinner;if(mar)M.resolve(g);else B.resolveTrick(g);lastPlayed=null;trickSnd(w);commit()}};
  }
  var p=g.turn;
  if(p===me){ping();return o?{ms:30000*TS,run:function(){autoPlay(p,true)}}:null}
  if(isBot(p)){
    ms=!o?(!mar&&g.phase==='play'?800:950):host?900:900+(11000+me*1000)*TS;
    return {ms:ms,run:function(){autoPlay(p,false)}};
  }
  return {ms:(host?33000:45000+me*2500)*TS,run:function(){autoPlay(p,true)}};
}
function autoPlay(p,late){ /* a computer seat, or a player who ran out of time */
  if(isM()){
    var mv=M.botMove(g,p);
    if(mv.swap&&!late){M.swap(g,p);snd('take');commit();return}
    if(mv.swap)mv=(M.swap(g,p),M.botMove(g,p));
    var ld=g.trick.length?g.trick[0].c:null;
    M.play(g,p,mv.card.id);lastPlayed=mv.card.id;snd(g.says[p]?'bel':'card');
    if(ld&&mv.card.s===g.trump&&ld.s!==g.trump&&M.pts(ld)>=10&&Math.random()<.6)botSay(p,me,'cut');
  }else if(g.phase==='play'){
    var prev=g.trick.length?B.winning(g):null,c=B.botCard(g,p);
    B.play(g,p,c.id);lastPlayed=c.id;snd(g.says[p]?'bel':'card');
    if(prev&&c.s===g.trump&&prev.c.s!==g.trump&&B.team(prev.p)!==B.team(p)&&B.pts(prev.c,g.trump)>=10&&Math.random()<.6)botSay(p,prev.p,'cut');
  }else{
    var b=late?{take:false}:B.botBid(g,p);
    B.bid(g,p,b.take,b.suit);snd(b.take?'take':'pass');
  }
  commit();
}
function nextRound(){
  if(isM()){if(g.phase!=='dealEnd')return;M.nextDeal(g)}else{if(g.phase!=='handEnd')return;B.nextHand(g)}
  snd('deal');commit();
}
function start(){
  me=0;
  if(cfg.game==='mariage'){g=M.newMatch(7);g.names=[cfg.names[0],cfg.names[1]];chatTo=1}
  else{g=B.newGame(cfg.names.slice(),cfg.target);chatTo=null}
  sheet=null;lastPlayed=null;closeChat();snd('deal');turnAt=Date.now();tick();
}
function openSettings(){
  clearTimeout(T);
  draft={names:cfg.names.slice(),target:cfg.target,game:cfg.game,code:(draft&&draft.code)||cfg.room||''};
  sheet='settings';render();
}

/* online play: one room per game code in the realtime database */
var DB=String(window.BELOTE_DB||'https://belote-49c56-default-rtdb.firebaseio.com').replace(/\/+$/,'');
function api(method,code,path,body){
  return fetch(DB+'/rooms/'+code+path+'.json',{method:method,body:body===undefined?undefined:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()});
}
function netFail(){netMsg=t('netErr');render()}
function myName(){readDraft();var n=((draft&&draft.names[0])||cfg.names[0]||'').trim();if(n){cfg.names[0]=n;save()}return n}
function newCode(){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<6;i++)s+=A.charAt(Math.floor(Math.random()*A.length));return s}
function createRoom(){
  var n=myName();netMsg='';
  if(!n){netMsg=t('needName');render();return}
  cfg.game=draft.game;cfg.target=draft.target;save();
  var code=newCode();
  api('PUT',code,'',{kind:draft.game,target:draft.game==='mariage'?7:draft.target,host:pid,started:false,made:{'.sv':'timestamp'},seats:{s0:{id:pid,n:n}}})
    .then(function(){enter(code)}).catch(netFail);
}
function joinRoom(){
  var n=myName(),code=String(draft.code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');netMsg='';
  if(!n){netMsg=t('needName');render();return}
  if(code.length!==6){netMsg=t('noRoom');render();return}
  api('GET',code,'').then(function(r){
    if(!r||!r.kind){netMsg=t('noRoom');render();return}
    var L=seatList(r),mine=-1,free=-1;
    L.forEach(function(s,i){if(s&&s.id===pid)mine=i;if(!s&&free<0)free=i});
    if(mine>=0)return enter(code);
    if(r.started||free<0){netMsg=t('full');render();return}
    return api('PUT',code,'/seats/s'+free,{id:pid,n:n}).then(function(){enter(code)});
  }).catch(netFail);
}
function enter(code){
  if(net&&net.es)net.es.close();
  clearTimeout(T);closeChat();
  net={code:code,room:null,seen:{},ready:false,lastJ:'',seat:-1,host:false,started:false,down:false,claiming:false};
  cfg.room=code;save();netMsg='';copied=false;
  var es=net.es=new EventSource(DB+'/rooms/'+code+'.json'),mine=net;
  es.addEventListener('put',function(ev){if(net!==mine)return;var d=JSON.parse(ev.data);applyPath(d.path,d.data,false);onRoom()});
  es.addEventListener('patch',function(ev){if(net!==mine)return;var d=JSON.parse(ev.data);applyPath(d.path,d.data,true);onRoom()});
  es.onopen=function(){if(net===mine&&net.down){net.down=false;render()}};
  es.onerror=function(){if(net===mine&&!net.down){net.down=true;render()}};
  sheet='lobby';render();
}
function applyPath(path,data,merge){
  var seg=String(path).split('/').filter(Boolean),o,i,k;
  if(!seg.length){
    if(!merge){net.room=data||{};return}
    net.room=net.room||{};
    for(k in data){if(data[k]===null)delete net.room[k];else net.room[k]=data[k]}
    return;
  }
  o=net.room=net.room||{};
  for(i=0;i<seg.length-1;i++){if(typeof o[seg[i]]!=='object'||o[seg[i]]===null)o[seg[i]]={};o=o[seg[i]]}
  k=seg[seg.length-1];
  if(!merge){if(data===null)delete o[k];else o[k]=data;return}
  if(typeof o[k]!=='object'||o[k]===null)o[k]={};
  for(i in data){if(data[i]===null)delete o[k][i];else o[k][i]=data[i]}
}
function onRoom(){
  var r=net.room;
  if(!r||!r.kind){netMsg=t('noRoom');leaveNet(true);return}
  var L=seatList(r),free=-1;
  net.seat=-1;net.host=r.host===pid;
  L.forEach(function(s,i){if(s&&s.id===pid)net.seat=i;if(!s&&free<0)free=i});
  if(net.seat<0){ /* someone took the seat first: try the next free one */
    if(r.started||free<0){netMsg=t('full');leaveNet(true);return}
    if(!net.claiming){
      net.claiming=true;var mine=net;
      api('PUT',net.code,'/seats/s'+free,{id:pid,n:cfg.names[0]}).then(function(){mine.claiming=false},function(){mine.claiming=false});
    }
    render();return;
  }
  var c=r.chat||{},k,m;
  for(k in c){
    if(net.seen[k])continue;
    net.seen[k]=1;m=c[k];
    if(net.ready&&net.started&&m&&typeof m.f==='number'&&m.f<players().length&&(m.t===-1||m.t===net.seat||m.f===net.seat))
      showMsg(m.f,m.t===-1?null:m.t,m.e?{e:String(m.e).slice(0,8)}:{t:String(m.m||'').slice(0,40)});
  }
  net.ready=true;
  if(r.started&&r.state&&r.state.j){
    if(!net.started){net.started=true;net.fresh=true;if(sheet==='lobby'||sheet==='settings')sheet=null}
    adopt(r.state.j);
  }else render();
}
function adopt(j){
  if(j===net.lastJ)return;
  var n;try{n=JSON.parse(j)}catch(e){return}
  if(!net.fresh&&g.kind===n.kind&&(g.v||0)>n.v)return;        /* an older state arriving late */
  var o=net.fresh?null:g;net.fresh=false;n.rng=Math.random;g=n;net.lastJ=j;me=net.seat;turnAt=Date.now();
  if(!o){chatTo=isM()?1-me:null;lastPlayed=null;snd('deal')}
  else{
    var ol=o.trick.length,nl=n.trick.length;
    if(nl>ol){var x=n.trick[nl-1];lastPlayed=x.c.id;snd(n.says&&n.says[x.p]&&n.says[x.p]!=='swap'&&n.says[x.p]!=='close'?'bel':'card')}
    else if(nl===0&&ol>0){lastPlayed=null;trickSnd(o.lastWinner)}
    if((n.handNo||n.dealNo)!==(o.handNo||o.dealNo))snd('deal');
    else if(!isM()&&n.taker!==o.taker&&n.taker!==null)snd('take');
  }
  tick();
}
function hostStart(){
  var r=net.room,L=seatList(r),c=0,ng;
  var names=L.map(function(s){return s?s.n:t('cpu')+(r.kind==='mariage'?'':' '+(++c))});
  ng=r.kind==='mariage'?M.newMatch(7):B.newGame(names,r.target);
  ng.names=names;ng.bots=L.map(function(s){return !s});ng.v=1;
  api('PATCH',net.code,'',{started:true,state:{v:1,j:ser(ng)}}).catch(netFail);
}
function sit(i){
  var r=net.room,L=seatList(r),up={};
  if(r.started||L[i]||net.seat<0)return;
  up['s'+i]={id:pid,n:L[net.seat].n};up['s'+net.seat]=null;
  api('PATCH',net.code,'/seats',up).catch(netFail);
}
function leaveNet(quiet){
  if(net){
    if(net.es)net.es.close();
    if(net.started&&g&&g.bots&&me>=0&&!g.bots[me]&&!endKindDone()){g.bots[me]=true;g.v=(g.v||0)+1;api('PUT',net.code,'/state',{v:g.v,j:ser(g)}).catch(function(){})}
    else if(!net.started&&net.seat>=0)api('PUT',net.code,'/seats/s'+net.seat,null).catch(function(){});
  }
  net=null;cfg.room='';save();if(draft)draft.code='';
  var msg=netMsg;start();netMsg=quiet?msg:'';openSettings();
}
function endKindDone(){return g.phase==='gameEnd'||g.phase==='matchEnd'}
setInterval(function(){
  var el=document.getElementById('cd');if(!el)return;
  var live=on()&&!endKind()&&!(isM()?g.pending:g.pendingTrick)&&!isBot(g.turn);
  el.textContent=live?' · '+Math.max(0,30-Math.floor((Date.now()-turnAt)/1000))+'s':'';
},500);

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a'),id;
  if(a==='card'){
    id=b.getAttribute('data-id');
    if(isM()?M.play(g,me,id):B.play(g,me,id)){lastPlayed=id;snd(g.says[me]?'bel':'card');commit()}
  }
  else if(a==='mswap'){if(M.swap(g,me)){snd('take');commit()}}
  else if(a==='mclose'){if(M.close(g,me)){snd('pass');commit()}}
  else if(a==='take'){if(B.bid(g,me,true)){snd('take');commit()}}
  else if(a==='suit'){if(B.bid(g,me,true,b.getAttribute('data-s'))){snd('take');commit()}}
  else if(a==='pass'){if(B.bid(g,me,false)){snd('pass');commit()}}
  else if(a==='next'){nextRound()}
  else if(a==='again'){start()}
  else if(a==='game'){readDraft();draft.game=b.getAttribute('data-g');render()}
  else if(a==='lang'){readDraft();cfg.lang=cfg.lang==='fr'?'en':'fr';save();render();if(chatEl.classList.contains('open'))renderChat()}
  else if(a==='chat'){if(chatEl.classList.contains('open'))closeChat();else{chatEl.classList.add('open');renderChat()}}
  else if(a==='sound'){cfg.sound=!cfg.sound;save();render();snd('take')}
  else if(a==='values'){if(!sheet){if(!on())clearTimeout(T);sheet='values';render()}}
  else if(a==='settings'){
    if(net){if(!sheet||sheet==='values'){netMsg='';copied=false;sheet='lobby';render()}}
    else if(!sheet||sheet==='values')openSettings();
  }
  else if(a==='tgt'){readDraft();draft.target=+b.getAttribute('data-n');render()}
  else if(a==='close'){sheet=null;tick()}
  else if(a==='start'){
    readDraft();
    cfg.names=draft.names.map(function(n,i){n=n.trim();return n||DEF[i]});cfg.target=draft.target;cfg.game=draft.game;save();netMsg='';start();
  }
  else if(a==='create'){createRoom()}
  else if(a==='join'){readDraft();joinRoom()}
  else if(a==='hstart'){hostStart()}
  else if(a==='sit'){sit(+b.getAttribute('data-i'))}
  else if(a==='leave'){netMsg='';leaveNet(false)}
  else if(a==='copy'){
    var done=function(){copied=true;render()},el=document.getElementById('lnk');
    try{navigator.clipboard.writeText(inviteLink()).then(done,function(){if(el){el.focus();el.select()}})}catch(err){if(el){el.focus();el.select()}}
  }
});
var qp=(location.search.match(/[?&]g=([A-Za-z0-9]{6})(?:&|$)/)||[])[1];
start();
openSettings();
if(qp){draft.code=qp.toUpperCase();render()}
})();
</script>
